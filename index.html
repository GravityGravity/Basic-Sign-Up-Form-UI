<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Sign Up</title>
		<link href="styles.css" rel="stylesheet" />
	</head>

	<body>
		<div class="side-header">
			<div class="header-text">
				<h1>SIGN UP</h1>
				<p>Sign up for a new account</p>
			</div>
		</div>

		<div class="side-body">
			<div class="side-container glassmorphism-effect">
                Statement of intent
            </div>

			<form action="" method="none">
                <p>Sign Up Forms</p>
                
				<div class="input-container">
					<div class="form-row">
						<label for="f-name">
							First Name*
							<input type="text" id="f-name" name="first_name" />
						</label>
						<label for="l-name">
							Last Name
							<input type="text" id="l-name" name="last_name" />
						</label>
					</div>

					<div class="form-row">
						<label for="mail">
							Email*
							<input type="email" id="mail" name="email" />
						</label>
						<label for="phone">
							Phone Number
							<input type="tel" id="phone" name="phone_number" />
						</label>
					</div>

					<div class="form-row">
						<label for="pass">
							Password*
							<input type="password" id="pass" name="password" />
						</label>
						<label for="c-pass">
							Confirm Password*
							<input type="password" id="c-pass" name="confirm_password" />
						</label>
					</div>

				</div>
            </form>

				<div class="side-container glassmorphism-effect">
					Account creations
					<button type="sumbit">Create Account</button>
				</div>
		</div>
	</body>
</html>
