<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Sign Up</title>
        <link href="styles.css" rel="stylesheet" />
    </head>

    <body>
        <div class="side-header">
            <div class="header-text">
                <img src="./images/white-simplified-logo.svg" />
                <h1>SIGN UP</h1>
                <h2>Sign up for a new account</h2>
            </div>
        </div>

        <div class="side-body glassmorphism-effect">
            <div class="side-container">
                <h2>Welcome!</h2>
                <h2>This is the signup page for the library!</h2>
                <p>Gain access to:</p>
                <ul>
                    <li>Free internet access</li>
                    <li>Book rental</li>
                    <li>Computer Access</li>
                    <li>Room Reservation</li>
                </ul>
            </div>

            <form id="signup-form" action="" method="none">
                <p>Sign Up Forms</p>

                <div class="input-container">
                    <div class="form-row">
                        <div>
                            <label for="f-name"> First Name* </label>
                            <input
                                type="text"
                                id="f-name"
                                name="first_name"
                                placeholder=" "
                                required
                            />
                        </div>
                        <div>
                            <label for="l-name"> Last Name </label>
                            <input type="text" id="l-name" name="last_name"
                            placeholder=" " />
                        </div>
                    </div>

                    <div class="form-row">
                        <div>
                            <label for="mail"> Email* </label>
                            <input
                                type="email"
                                id="mail"
                                name="email"
                                placeholder=" "
                                required
                            />
                        </div>
                        <div>
                            <label for="phone"> Phone Number </label>
                            <input type="tel" id="phone" name="phone_number"
                            placeholder=" " />
                        </div>
                    </div>

                    <div class="form-row">
                        <div>
                            <label for="pass"> Password* </label>
                            <input
                                type="password"
                                id="pass"
                                name="password"
                                placeholder=" "
                                required
                            />
                        </div>
                        <div>
                            <label for="c-pass"> Confirm Password* </label>
                            <input
                                type="password"
                                id="c-pass"
                                name="confirm_password"
                                placeholder=" "
                                required
                            />
                        </div>
                    </div>
                </div>
            </form>

            <div class="side-container">
                <button type="submit" form="signup-form">Create Account</button>
                <p>Already have an account? <a href="">Log In</a></p>
            </div>
        </div>
    </body>
</html>
